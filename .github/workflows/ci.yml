name: ZestHealth CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zesthealth
          POSTGRES_PASSWORD: zestpassword
          POSTGRES_DB: zesthealth_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Prisma migrations on Ephemeral DB
      run: npx prisma migrate deploy
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://zesthealth:zestpassword@localhost:5432/zesthealth_test_db?schema=public

    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./backend

    - name: Run Build
      run: npm run build
      working-directory: ./backend

    - name: Run E2E Integration Tests
      run: npm run test:e2e
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://zesthealth:zestpassword@localhost:5432/zesthealth_test_db?schema=public
        REDIS_URL: redis://localhost:6379
        ENCRYPTION_KEY: 12345678901234567890123456789012
