version: '3.8'
services:
  db:
    image: postgres:15
    container_name: zesthealth_postgres
    environment:
      POSTGRES_USER: zesthealth
      POSTGRES_PASSWORD: zestpassword
      POSTGRES_DB: zesthealth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zesthealth_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
